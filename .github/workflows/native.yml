name: Native validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.runner }} / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {runner: ubuntu-24.04, cc: gcc, machine: x86_64, arch: X64}
          - {runner: ubuntu-24.04, cc: clang, machine: x86_64, arch: X64}
          - {runner: ubuntu-24.04-arm, cc: gcc, machine: aarch64, arch: ARM64}
          - {runner: macos-15, cc: clang, machine: arm64, arch: ARM64}
          - {runner: macos-15-intel, cc: clang, machine: x86_64, arch: X64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify native environment
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          mkdir -p build-evidence
          { uname -a; "$CC" --version; cmake --version; python3 --version; git rev-parse HEAD; echo "runner.arch=$RUNNER_ARCH"; if [ "$(uname)" = Linux ]; then lscpu; cat /etc/os-release; else sw_vers; sysctl -n machdep.cpu.brand_string; sysctl -n hw.physicalcpu; fi; } > build-evidence/environment.txt
      - name: Compile and execute native tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build --parallel 2 --verbose
          file build/rr build/rr_tests build/rr_bench | tee build-evidence/binaries.txt
          ctest --test-dir build --output-on-failure
      - name: Generate bounded benchmark evidence
        run: |
          python3 benchmarks/run.py --binary build/rr_bench --output build-evidence/benchmark.json --side 64 --queries 101 --repeats 1 --compiler ${{ matrix.cc }} --flags=@build/compile_commands.json
          python3 benchmarks/plan_run.py --binary build/rr_plan_bench --output build-evidence/heuristic-plans.json --repeats 2 --compiler ${{ matrix.cc }} --flags=@build/compile_commands.json
          python3 benchmarks/hex_run.py --binary build/rr_hex_bench --output build-evidence/hex-fixture.json --compile-commands build/compile_commands.json
          cp build/compile_commands.json build-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.runner }}-${{ matrix.cc }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build-evidence/
          retention-days: 14
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          cmake -S . -B build-san -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DRR_SANITIZE=ON
          cmake --build build-san --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-san --output-on-failure
          build-san/rr_bench weighted astar morton 16 21 123456789 > /dev/null
